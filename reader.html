<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9e9f6"><title>Stasya Reader · 俄语阅读</title><style>:root{--blue:#d9e9f6;--ink:#273b50;--muted:#718396;--line:#dbe6ef;--bg:#f6f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}header{background:#e5f0f9;padding:18px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid #d1e2ef}header h1{margin:0;font-family:Georgia,serif;font-size:27px}header p{margin:5px 0 0;color:#657d90;font-size:13px}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}button{border:1px solid #cddfec;background:white;color:#35516b;border-radius:11px;padding:11px 15px;font-size:14px;cursor:pointer}button.primary{background:#719fc4;color:white;border-color:#719fc4}button:active{transform:scale(.98)}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:16px}.paper,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 5px 20px #cedce622}.paper h2{margin:0 0 5px;font-size:23px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}.story{font-size:21px;line-height:2.1;white-space:normal}.sentence{display:block;margin:0 0 13px;padding:2px 4px;border-radius:7px}.sentence.selected{background:#f0f6fb}.word{cursor:pointer;border-radius:5px;padding:2px 1px}.word:hover,.word.active{background:#cde5f5}.word.saved{border-bottom:2px solid #7caccd}.panel{position:sticky;top:12px;height:fit-content}.panel h3{margin:0 0 12px}.translation{font-size:17px;line-height:1.8}.ru{font-size:20px;font-weight:650;margin:10px 0}.note{color:var(--muted);font-size:13px;line-height:1.7}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:17px}.vocab{max-height:230px;overflow:auto}.vitem{display:flex;justify-content rder-radius:10px"><textarea id="newtext" placeholder="在这里粘贴俄语文章……"></textarea><div style="display:flex;gap:10px;margin-top:12px"><button class="primary" id="saveimport">开始阅读</button><button id="cancel">取消</button></div></dialog><script>

['В тот день я зашла в большой супермаркет в Минске.','那天我走进了明斯克的一家大超市。'],['Мне нужны были сливочный сыр и ванильный экстракт для десерта.','我需要买做甜点用的奶油奶酪和香草精。'],['Я думала, что быстро всё куплю и пойду домой.','我原以为很快就能买完回家。'],['Ну да, конечно.','呵，想得倒美。'],['Минут через десять я поняла, что уже третий раз прохожу мимо одного и того же холодильника.','大概过了十分钟，我发现自己已经第三次经过同一个冰柜。'],['— Ты что-то ищешь?','“你在找什么吗？”'],['Я обернулась. Рядом стоял парень примерно моего возраста. Симпатичный, кстати. Очень даже.','我回过头。旁边站着一个和我差不多年纪的男生。顺便说一句，长得挺好看的。相当好看。'],['— Да, — засмеялась я. — Вообще-то я ищу отдел с товарами для выпечки, но, кажется, уже заблудилась.','“对，”我笑了，“其实我在找烘焙用品区，但我好像已经迷路了。”'],['— Я заметил. Ты тут уже третий круг наматываешь.','“我发现了。你都在这里绕第三圈了。”'],['— Серьёзно? Блин, как стыдно!','“真的吗？天哪，太尴尬了！”'],['— Да ладно, ничего страшного. Что именно тебе нужно?','“没事啦，没什么大不了的。你具体要找什么？”'],['— Сливочный сыр и ванильный экстракт. Хочу приготовить чизкейк.','“奶油奶酪和香草精。我想做芝士蛋糕。”'],['— Сыр вроде вон там. А вот с экстрактом сложнее. Пойдём посмотрим?','“奶酪好像在那边。香草精就比较难找了。一起去看看？”'],['Мы пошли вдоль полок. Он что-то рассказывал про магазин, а я пыталась одновременно слушать и читать надписи на упаковках.','我们沿着货架往前走。他一边说着这家超市的事，我一边努力听懂，还要看包装上的字。'],['— Подожди, — сказала я. — Можно чуть помедленнее? Я ещё учу русский.','“等一下，”我说，“可以稍微慢一点吗？我还在学俄语。”'],['— А-а, так ты не местная? А я-то думаю, почему у тебя акцент.','“原来你不是本地人啊？我还在想你怎么有口音呢。”'],['— Я из Китая. И вообще, мой русский пока не очень.','“我来自中国。而且我的俄语还不太好。”'],['— Да нормально ты говоришь. Я тебя прекрасно понимаю.','“你说得挺好的啊。我完全听得懂。”'],['— Спасибо, но иногда у меня в голове просто пустота. Слова куда-то исчезают.','“谢谢，但有时候我脑子里就是一片空白，词都不知道跑哪去了。”'],['Он рассмеялся. — Бывает. У меня с английским то же самое.','他笑了：“正常，我说英语也这样。”'],['Наконец мы нашли нужный отдел. Я взяла маленькую бутылочку и посмотрела на этикетку.','我们终于找到了那个区域。我拿起一个小瓶子看了看标签。'],['— О, кажется, это оно!','“噢，好像就是这个！”'],['— Победа! — сказал он. — Теперь ты официально можешь выйти из магазина.','“胜利！”他说，“现在你正式获准离开超市了。”'],['— Не факт. Мне ещё кассу найти надо.','“那可不一定。我还得找到收银台呢。”'],['Мы оба засмеялись.','我们俩都笑了。'],['Я уже собиралась попрощаться, но вдруг подумала: ну а почему бы и нет?','我正准备告别，突然想：为什么不试试呢？'],['— Слушай, можно я скажу кое-что странное?','“那个，我能说件有点奇怪的事吗？”'],['— Ну, попробуй.','“说来听听。”'],['— Ты очень симпатичный. И с тобой приятно общаться.','“你长得很好看，而且和你聊天很愉快。”'],['Он на секунду удивился, а потом улыбнулся.','他愣了一下，然后笑了。'],['— Ого. Спасибо! Неожиданно.','“哇，谢谢！挺突然的。”'],['— Надеюсь, я тебя не смутила. Просто подумала, что было бы классно познакомиться поближе.','“希望没让你尴尬。我只是觉得，如果能进一步认识就好了。”'],['— Да нет, всё нормально. Ты тоже прикольная.','“没有没有，没事。你也挺有意思的。”'],['— Слушай, а у тебя есть Telegram? Может, обменяемся контактами?','“对了，你有 Telegram 吗？要不要交换联系方式？”'],['— Давай. Только обещай, что в следующий раз не будешь три раза обходить один и тот же холодильник.','“好啊。但你得答应我，下次别再绕着同一个冰柜走三圈了。”'],['— Ничего не обещаю.','“我可不保证。”'],['Мы обменялись контактами и пошли каждый по своим делам.','我们交换了联系方式，然后各忙各的去了。'],['Уже на выходе я получила сообщение: «Ну что, кассу нашла? 😎»','快走到出口时，我收到一条消息：“怎么样，找到收银台了吗？😎”'],['Я улыбнулась и ответила: «Да. Но теперь не могу найти выход».','我笑着回复：“找到了。但我现在找不到出口了。”'],['Через пару секунд пришёл ответ: «Ахахах, тебе точно нужен гид».','几秒后他回：“哈哈哈，你真需要个导游。”']];

第四格'],факт:['事实','не факт = 不一定'],попрощаться:['告别','完成体动词'],вдруг:['突然','副词'],почему:['为什么','疑问词'],попробуй:['试试看','ты 形式命令式'],приятно:['愉快、舒服','副词／状态词'],общаться:['交流、聊天','动词不定式'],удивился:['惊讶了','男性过去时'],улыбнулся:['笑了','男性过去时'],неожиданно:['出乎意料','副词'],надеюсь:['我希望','надеяться 第一人称'],смутила:['让人尴尬了','女性过去时'],классно:['很棒','口语'],познакомиться:['认识、结识','完成体动词'],поближе:['更熟悉一些','副词比较级'],прикольная:['有趣的、挺酷的（女生）','轻松口语'],обменяемся:['我们交换吧','обменяться 第一人称复数'],контактами:['联系方式','第五格复数'],обещай:['答应我','ты 形式命令式'],следующий:['下一个','形容词'],получила:['收到了','女性过去时'],сообщение:['消息','名词'],ответила:['回复了','女性过去时'],выход:['出口','名词'],секунд:['秒','复数第二格'],пришёл:['来了、收到','男性过去时'],точно:['确实、肯定','副词'],гид:['向导、导游','名词'],только:['只是、仅仅','副词'],сейчас:['现在','副词'],всё:['一切、全部','代词'],очень:['非常','副词'],меня:['我（宾格／属格）','代词'],тебя:['你（宾格／属格）','代词'],тут:['这里','口语'],там:['那里','副词'],домой:['回家','方向副词'],пока:['暂时、目前','副词'],уже:['已经','副词'],ещё:['还、再','副词'],можно:['可以吗','常用礼貌询问'],спасибо:['谢谢','常用表达']};
const storeKey='stasya_reader_vocab_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{};let lines=demo.slice(),active=0,selectedWord='',showChinese=false;const $=id=>document.getElementById(id);function norm(s){return s.toLowerCase().replace(/ё/g,'ё')};function render(){let el=$('story');el.textContent='';lines.forEach(([ru,zh],i)=>{let row=document.createElement('div');row.className='sentence'+(i===active?' selected':'');row.dataset.i=i;let re=/([А-Яа-яЁё]+(?:-[А-Яа-яЁё]+)*)/g,last=0,m;while((m=re.exec(ru))){row.append(document.createTextNode(ru.slice(last,m.index)));let w=document.createElement('span');w.className='word'+(saved[norm(m[0])]?' saved':'')+(selectedWord===norm(m[0])&&active===i?' active':'');w.textContent=m[0];w.onclick=e=>{e.stopPropagation();active=i;selectedWord=norm(m[0]);detail();render()};row.append(w);last=m.index+m[0].length}row.append(document.createTextNode(ru.slice(last)));row.onclick=()=>{active=i;selectedWord='';detail();render()};el.append(row);if(showChinese){let t=document.createElement('div');t.style='color:#6b8295;font-size:15px;line-height:1.6;margin:-8px 0 16px 4px';t.textContent=zh||'这句暂未提供中文翻译';el.append(t)}})}function detail(){let [ru,zh]=lines[active]||['',''];if(selectedWord){let item=dict[selectedWord],word=selectedWord;let root=$('detail');root.textContent='';let a=document.createElement('div');a.className='ru';a.textContent=word;root.append(a);let b=document.createElement('div');b.className='translation';b.textContent=item?item[0]:'此词尚未收录中文释义';root.append(b);let c=document.createElement('p');c.className='note';c.textContent=item?item[1]:'可以继续阅读，或将这个词收藏后与我一起分析。';root.append(c);let btn=document.createElement('button');btn.textContent=saved[word]?'★ 取消收藏':'☆ 收藏生词';btn.onclick=()=>{if(saved[word])delete saved[word];else saved[word]={meaning:item?item[0]:'待补充',note:item?item[1]:''};persist();render();detail()};root.append(btn);let sp=document.createElement('button');sp.textContent='🔊 读单词';sp.style.marginLeft='7px';sp.onclick=()=>speak(word);root.append(sp)}else{$('detail').innerHTML='';let a=document.createElement('div');a.className='ru';a.textContent=ru;$('detail').append(a);let b=document.createElement('div');b.className='translation';b.textContent=zh||'这句尚未提供中文翻译';$('detail').append(b);let bt=document.createElement('button');bt.textContent='🔊 朗读这句';bt.onclick=()=>speak(ru);$('detail').append(bt)}}function persist(){try{localStorage.setItem(storeKey,JSON.stringify(saved))}catch{};vocab()}function vocab(){let root=$('vocab');root.textContent='';let keys=Object.keys(saved);$('count').textContent=keys.length;if(!keys.length){let p=document.createElement('p');p.className='note';p.textContent='收藏的词会出现在这里。';root.append(p)}keys.forEach(k=>{let d=document.createElement('div');d.className='vitem';let t=document.createElement('span');t.textContent=k+' · '+saved[k].meaning;d.append(t);let b=document.createElement('button');b.textContent='×';b.style.padding='2px 8px';b.onclick=()=>{delete saved[k];persist();render()};d.append(b);root.append(d)})}function speak(text){if(!('speechSynthesis'in window)){alert('当前浏览器不支持系统朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=Number($('speed').value);let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('ru'))||null;speechSynthesis.speak(u)}$('play').onclick=()=>speak(lines[active][0]);$('stop').onclick=()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel()};$('toggle').onclick=()=>{showChinese=!showChinese;render()};$('speed').oninput=()=>{$('speedval').textContent=$('speed').value+'×'};$('import').onclick=()=>$('modal').showModal();$('cancel').onclick=()=>$('modal').close();$('saveimport').onclick=()=>{let s=$('newtext').value.trim();if(!s)return alert('先粘贴俄语文章');lines=s.split(/\n+/).map(x=>[x.trim(),'']).filter(x=>x[0]);$('title').textContent=$('newtitle').value.trim()||'我的俄语文章';active=0;selectedWord='';showChinese=false;render();detail();$('modal').close()};$('reset').onclick=()=>{lines=demo.slice();$('title').textContent='Кажется, я заблудилась';active=0;selectedWord='';render();detail()};$('export').onclick=async()=>{let s=Object.entries(saved).map(([k,v])=>k+' — '+v.meaning+(v.note?'（'+v.note+'）':'')).join('\n');if(!s)return alert('还没有收藏的词');try{await navigator.clipboard.writeText(s);alert('生词表已复制')}catch{prompt('复制生词表',s)}};render();detail();vocab();</script></body></html>
