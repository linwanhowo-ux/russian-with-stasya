['В тот день я зашла в большой супермаркет в Минске.','那天我走进了明斯克的一家大超市。'],['Мне нужны были сливочный сыр и ванильный экстракт для десерта.','我需要买做甜点用的奶油奶酪和香草精。'],['Я думала, что быстро всё куплю и пойду домой.','我原以为很快就能买完回家。'],['Ну да, конечно.','呵，想得倒美。'],['Минут через десять я поняла, что уже третий раз прохожу мимо одного и того же холодильника.','大概过了十分钟，我发现自己已经第三次经过同一个冰柜。'],['— Ты что-то ищешь?','“你在找什么吗？”'],['Я обернулась. Рядом стоял парень примерно моего возраста. Симпатичный, кстати. Очень даже.','我回过头。旁边站着一个和我差不多年纪的男生。顺便说一句，长得挺好看的。相当好看。'],['— Да, — засмеялась я. — Вообще-то я ищу отдел с товарами для выпечки, но, кажется, уже заблудилась.','“对，”我笑了，“其实我在找烘焙用品区，但我好像已经迷路了。”'],['— Я заметил. Ты тут уже третий круг наматываешь.','“我发现了。你都在这里绕第三圈了。”'],['— Серьёзно? Блин, как стыдно!','“真的吗？天哪，太尴尬了！”'],['— Да ладно, ничего страшного. Что именно тебе нужно?','“没事啦，没什么大不了的。你具体要找什么？”'],['— Сливочный сыр и ванильный экстракт. Хочу приготовить чизкейк.','“奶油奶酪和香草精。我想做芝士蛋糕。”'],['— Сыр вроде вон там. А вот с экстрактом сложнее. Пойдём посмотрим?','“奶酪好像在那边。香草精就比较难找了。一起去看看？”'],['Мы пошли вдоль полок. Он что-то рассказывал про магазин, а я пыталась одновременно слушать и читать надписи на упаковках.','我们沿着货架往前走。他一边说着这家超市的事，我一边努力听懂，还要看包装上的字。'],['— Подожди, — сказала я. — Можно чуть помедленнее? Я ещё учу русский.','“等一下，”我说，“可以稍微慢一点吗？我还在学俄语。”'],['— А-а, так ты не местная? А я-то думаю, почему у тебя акцент.','“原来你不是本地人啊？我还在想你怎么有口音呢。”'],['— Я из Китая. И вообще, мой русский пока не очень.','“我来自中国。而且我的俄语还不太好。”'],['— Да нормально ты говоришь. Я тебя прекрасно понимаю.','“你说得挺好的啊。我完全听得懂。”'],['— Спасибо, но иногда у меня в голове просто пустота. Слова куда-то исчезают.','“谢谢，但有时候我脑子里就是一片空白，词都不知道跑哪去了。”'],['Он рассмеялся. — Бывает. У меня с английским то же самое.','他笑了：“正常，我说英语也这样。”'],['Наконец мы нашли нужный отдел. Я взяла маленькую бутылочку и посмотрела на этикетку.','我们终于找到了那个区域。我拿起一个小瓶子看了看标签。'],['— О, кажется, это оно!','“噢，好像就是这个！”'],['— Победа! — сказал он. — Теперь т
